<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller: crea tu agente de IA · Santo Tomás</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#inicio"><img class="logoU" src="logo-usta.png" alt="Universidad Santo Tomás, Bucaramanga"><span>Taller de <b>Agentes</b></span></a>
  <nav id="nav" aria-label="Secciones"></nav>
  <div class="who" id="who" hidden><span id="whoName"></span><button id="logout" type="button">Salir</button></div>
  <div class="clock" id="clock" title="Reloj de la sesión (2 horas)">
    <span id="clockTime">00:00</span>
    <button id="clockBtn" type="button" aria-label="Iniciar o pausar el reloj">▶</button>
    <button id="clockReset" type="button" aria-label="Reiniciar el reloj">↺</button>
  </div>
</header>
<main id="view"></main>
<footer class="foot"><img class="logoF" src="logo-usta.png" alt="Universidad Santo Tomás, Bucaramanga"><div>Facultad de Ingeniería en Inteligencia Artificial</div><div>Curso dirigido por <b>Dr.-Ing. Cesar Hernando Valencia Niño</b></div></footer>
<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
